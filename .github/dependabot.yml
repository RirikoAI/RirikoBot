version: 2
updates:
  # npm (pnpm lockfile) updates target develop, the integration branch (AGENTS.md section 10).
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # GitHub Actions workflow updates also target develop.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

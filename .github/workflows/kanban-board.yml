name: Kanban board

on:
  pull_request:
    paths: ['docs/kanban/**']
  push:
    paths: ['docs/kanban/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/kanban/render-board.mjs --check

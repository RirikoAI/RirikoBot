version: 2.1

# Quality gates for every push (STORY-123). Jobs run in parallel; each one installs from the
# cached pnpm store and builds the workspace packages, because every @ririko/* export points at
# ./dist. See docs/testing.md "Continuous Integration".

orbs:
  codecov: codecov/codecov@6.1.0

executors:
  node:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

commands:
  setup:
    description: Check out, install dependencies from the pnpm store cache and build packages
    steps:
      - checkout
      - run:
          name: Enable pnpm (version pinned by packageManager)
          command: |
            sudo corepack enable pnpm
            pnpm --version
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Build workspace packages
          command: pnpm build

  build-and-smoke:
    description: Build both production images and run the smoke checks against them
    steps:
      - setup_remote_docker
      - run:
          # The Dockerfile uses BuildKit cache mounts, which need the buildx plugin.
          name: Check for Docker Buildx
          command: |
            if ! docker buildx version; then
              mkdir -p ~/.docker/cli-plugins
              curl -sSfL "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64" \
                -o ~/.docker/cli-plugins/docker-buildx
              chmod +x ~/.docker/cli-plugins/docker-buildx
              docker buildx version
            fi
      - run:
          name: Build the bot image
          command: docker build --target bot-runner -t ririko-bot:smoke .
      - run:
          name: Build the dashboard image
          command: docker build --target web-runner -t ririko-web:smoke .
      - run:
          # Runs every check through docker run/exec/logs/diff, so it works on the remote engine.
          name: Smoke-check both images
          command: node scripts/docker-smoke.ts bot web

jobs:
  lint:
    executor: node
    steps:
      - setup
      - run:
          name: ESLint
          command: pnpm lint
      - run:
          name: Prettier
          command: pnpm format:check

  typecheck:
    executor: node
    steps:
      - setup
      - run:
          name: TypeScript
          command: pnpm typecheck

  test:
    executor: node
    steps:
      - run:
          # FFmpeg is a runtime prerequisite (docs/development.md) that the music player tests
          # exercise; canvas renderers draw text with system `sans-serif` fonts.
          name: Install FFmpeg and fonts
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
      - setup
      - run:
          name: Vitest with coverage
          command: pnpm test:ci
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage
          destination: coverage
      # Uploads are skipped without failing the job until CODECOV_TOKEN is set in the
      # CircleCI project settings.
      - codecov/upload:
          files: coverage/lcov.info
          disable_search: true
          flags: unit
      - codecov/upload:
          files: test-results/junit.xml
          disable_search: true
          report_type: test_results

  # Runs the dual-dialect repository suites (describeDialects) and the adventure concurrency suite
  # against a real Postgres. Each suite creates and drops its own random schema.
  test-postgres:
    docker:
      - image: cimg/node:22.23
        environment:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:5432/ririko_test
          ADVENTURE_TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:5432/ririko_test
      - image: cimg/postgres:16.15
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ririko_test
    resource_class: medium
    steps:
      - run:
          # test:postgres also runs the services suites; canvas renderers measure text with the
          # system `sans-serif` font, as in the `test` job.
          name: Install fonts
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core
      - setup
      - run:
          name: Wait for Postgres
          command: |
            for attempt in $(seq 1 30); do
              node -e "require('net').connect(5432, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))" && exit 0
              sleep 1
            done
            echo 'Postgres did not start' && exit 1
      - run:
          name: Vitest on Postgres
          command: pnpm test:postgres

  build-web:
    executor: node
    steps:
      - setup
      - run:
          name: Next.js production build
          command: pnpm --filter @ririko/web build

  e2e:
    executor: node
    steps:
      - run:
          # The card album draws card text with the system `sans-serif` font.
          name: Install fonts
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core
      - setup
      - restore_cache:
          keys:
            - playwright-browsers-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install Chromium for Playwright
          command: pnpm --filter @ririko/web exec playwright install --with-deps chromium
      - save_cache:
          key: playwright-browsers-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/ms-playwright
      - run:
          name: Next.js production build
          command: pnpm --filter @ririko/web build
      - run:
          # Starts the fake Discord API and `next start` itself (apps/web/playwright.config.ts).
          name: Playwright dashboard E2E
          command: pnpm --filter @ririko/web exec playwright test
      - store_test_results:
          path: apps/web/e2e-results
      - store_artifacts:
          path: apps/web/e2e-results
          destination: e2e

  # Builds both production images and runs the smoke checks against them (docs/deployment.md
  # section 2.1). Images stay on the remote engine; nothing is pushed.
  docker:
    executor: node
    environment:
      BUILDX_VERSION: 0.37.2
    steps:
      - checkout
      - build-and-smoke

  # Tag-driven release (docs/release.md): runs only for git tags like v2.1.3 or v2.1.3-rc.1.
  # Builds and smoke-checks both images as the `docker` job does, then pushes
  # ririkoai/ririkobot and ririkoai/ririkobot-dashboard with the tags from
  # scripts/release-tags.ts (2.1.3, 2.1 and 2; a prerelease only gets its full version).
  # It never pushes `latest`; the maintainer moves that by hand.
  # Docker Hub credentials come from the CircleCI context `dockerhub` (DOCKERHUB_USERNAME and
  # DOCKERHUB_TOKEN, an access token with read and write scope), which the maintainer creates.
  release:
    executor: node
    environment:
      BUILDX_VERSION: 0.37.2
    steps:
      - checkout
      - run:
          name: Docker Hub tags for this git tag
          command: |
            node scripts/release-tags.ts "$CIRCLE_TAG" > /tmp/release-tags
            cat /tmp/release-tags
            if grep -qx latest /tmp/release-tags; then echo 'Refusing to push latest' && exit 1; fi
      - build-and-smoke
      - run:
          name: Push both images to Docker Hub
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            while read -r tag; do
              docker tag ririko-bot:smoke "ririkoai/ririkobot:$tag"
              docker tag ririko-web:smoke "ririkoai/ririkobot-dashboard:$tag"
              docker push "ririkoai/ririkobot:$tag"
              docker push "ririkoai/ririkobot-dashboard:$tag"
            done < /tmp/release-tags
            docker logout

  secrets:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C /tmp gitleaks
            /tmp/gitleaks version
      - run:
          name: Scan full git history
          # Same rules as the .husky/pre-commit hook; known findings live in .gitleaksignore.
          command: /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - test
      - test-postgres
      - build-web
      - e2e
      - docker
      - secrets
  # Keep the tag pattern in sync with RELEASE_TAG_PATTERN in scripts/release-tags.ts.
  release:
    jobs:
      - release:
          context: dockerhub
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/

version: 2.1

# Quality gates for every push (STORY-123). Jobs run in parallel; each one installs from the
# cached pnpm store and builds the workspace packages, because every @ririko/* export points at
# ./dist. See docs/testing.md "Continuous Integration".

orbs:
  codecov: codecov/codecov@6.1.0

executors:
  node:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

commands:
  setup:
    description: Check out, install dependencies from the pnpm store cache and build packages
    steps:
      - checkout
      - run:
          name: Enable pnpm (version pinned by packageManager)
          command: |
            sudo corepack enable pnpm
            pnpm --version
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Build workspace packages
          command: pnpm build

  build-and-smoke:
    description: Build both production images and run the smoke checks against them
    steps:
      - setup_remote_docker
      - run:
          # The Dockerfile uses BuildKit cache mounts, which need the buildx plugin.
          name: Check for Docker Buildx
          command: |
            if ! docker buildx version; then
              mkdir -p ~/.docker/cli-plugins
              curl -sSfL "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64" \
                -o ~/.docker/cli-plugins/docker-buildx
              chmod +x ~/.docker/cli-plugins/docker-buildx
              docker buildx version
            fi
      - run:
          name: Build the bot image
          command: docker build --target bot-runner -t ririko-bot:smoke .
      - run:
          name: Build the dashboard image
          command: docker build --target web-runner -t ririko-web:smoke .
      - run:
          # Runs every check through docker run/exec/logs/diff, so it works on the remote engine.
          name: Smoke-check both images
          command: node scripts/docker-smoke.ts bot web

  # Runs one command on a production host through its Cloudflare Tunnel, as the `deploy` user.
  # The host forces ririko-deploy-ssh, which accepts only `deploy <version>` and `status`
  # (deploy/host/bin, docs/release.md). It needs no checkout: everything comes from the CircleCI
  # context of the job that calls it:
  #   DEPLOY_SSH_HOST                 the host's tunnel hostname, for example ssh-staging.<domain>
  #   DEPLOY_SSH_KEY_B64              the deploy user's private key, base64 on one line
  #   DEPLOY_KNOWN_HOSTS              the host key line, under DEPLOY_SSH_HOST
  #   TUNNEL_SERVICE_TOKEN_ID/SECRET  the Cloudflare Access service token; cloudflared reads both
  #                                   from its environment, so they never appear in a command line
  # The step fails with the exit status of the host command (docs/release.md section 8.4).
  ssh-host:
    description: Install a pinned cloudflared and run one command on a host over Cloudflare Access
    parameters:
      remote_command:
        type: string
    steps:
      - run:
          name: Install cloudflared
          environment:
            # Keep both lines together: the sha256 is of the linux amd64 .deb of that release.
            CLOUDFLARED_VERSION: 2026.9.3
            CLOUDFLARED_SHA256: bc073ef293d504cf5ac533bd0aa1c824ef6b4f358765ccaa6628a8a95cacb4b7
          command: |
            curl -sSfL --retry 3 \
              -o /tmp/cloudflared.deb \
              "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
            echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared.deb" | sha256sum --check -
            sudo dpkg -i /tmp/cloudflared.deb
            cloudflared --version
      - run:
          name: Write the SSH key and the pinned host key
          command: |
            : "${DEPLOY_SSH_HOST:?DEPLOY_SSH_HOST is missing from the CircleCI context}"
            : "${DEPLOY_SSH_KEY_B64:?DEPLOY_SSH_KEY_B64 is missing from the CircleCI context}"
            : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is missing from the CircleCI context}"
            : "${TUNNEL_SERVICE_TOKEN_ID:?TUNNEL_SERVICE_TOKEN_ID is missing from the CircleCI context}"
            : "${TUNNEL_SERVICE_TOKEN_SECRET:?TUNNEL_SERVICE_TOKEN_SECRET is missing from the CircleCI context}"
            umask 077
            mkdir -p ~/.ssh
            printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - run:
          name: Run on the host
          # The host prints its progress while it pulls and waits for readiness, which can take
          # several minutes.
          no_output_timeout: 20m
          command: |
            status=0
            ssh \
              -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              "deploy@${DEPLOY_SSH_HOST}" \
              "<< parameters.remote_command >>" || status=$?
            case "$status" in
              0) echo 'The host command succeeded.' ;;
              2) echo 'The host rejected the command or the version (a Lavalink host also refuses an instance it does not run).' ;;
              3) echo 'The host is busy: another deploy, backup or watchdog run holds its lock. Run the job again later.' ;;
              4) echo 'The new release did not become ready. The host started the previous release again; the database was not restored.' ;;
              5) echo 'The new release did not become ready and the host has no previous release: nothing is running. Fix it on the host.' ;;
              255) echo 'SSH could not connect or authenticate. Check the tunnel, the Access service token, the key and the pinned host key.' ;;
              *) echo "The host command failed with status ${status}. Its output is above." ;;
            esac
            exit "$status"

jobs:
  lint:
    executor: node
    steps:
      - setup
      - run:
          name: ESLint
          command: pnpm lint
      - run:
          name: Prettier
          command: pnpm format:check
      - run:
          # The host scripts (deploy/host) run as root on the production hosts.
          name: ShellCheck
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends shellcheck
            find deploy/host -name '*.sh' -print0 | xargs -0 --no-run-if-empty shellcheck -x

  typecheck:
    executor: node
    steps:
      - setup
      - run:
          name: TypeScript
          command: pnpm typecheck

  test:
    executor: node
    steps:
      - run:
          # FFmpeg is a runtime prerequisite (docs/development.md) that the music player tests
          # exercise; canvas renderers draw text with system `sans-serif` fonts.
          name: Install FFmpeg and fonts
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
      - setup
      - run:
          name: Vitest with coverage
          command: pnpm test:ci
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage
          destination: coverage
      # Uploads are skipped without failing the job until CODECOV_TOKEN is set in the
      # CircleCI project settings.
      - codecov/upload:
          files: coverage/lcov.info
          disable_search: true
          flags: unit
      - codecov/upload:
          files: test-results/junit.xml
          disable_search: true
          report_type: test_results

  # Runs the dual-dialect repository suites (describeDialects) and the adventure concurrency suite
  # against a real Postgres. Each suite creates and drops its own random schema.
  test-postgres:
    docker:
      - image: cimg/node:22.23
        environment:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:5432/ririko_test
          ADVENTURE_TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:5432/ririko_test
      - image: cimg/postgres:16.15
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ririko_test
    resource_class: medium
    steps:
      - run:
          # test:postgres also runs the services suites; canvas renderers measure text with the
          # system `sans-serif` font, as in the `test` job.
          name: Install fonts
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core
      - setup
      - run:
          name: Wait for Postgres
          command: |
            for attempt in $(seq 1 30); do
              node -e "require('net').connect(5432, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))" && exit 0
              sleep 1
            done
            echo 'Postgres did not start' && exit 1
      - run:
          name: Vitest on Postgres
          command: pnpm test:postgres

  build-web:
    executor: node
    steps:
      - setup
      - run:
          name: Next.js production build
          command: pnpm --filter @ririko/web build

  e2e:
    executor: node
    steps:
      - run:
          # The card album draws card text with the system `sans-serif` font.
          name: Install fonts
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core
      - setup
      - restore_cache:
          keys:
            - playwright-browsers-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install Chromium for Playwright
          command: pnpm --filter @ririko/web exec playwright install --with-deps chromium
      - save_cache:
          key: playwright-browsers-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/ms-playwright
      - run:
          name: Next.js production build
          command: pnpm --filter @ririko/web build
      - run:
          # Starts the fake Discord API and `next start` itself (apps/web/playwright.config.ts).
          name: Playwright dashboard E2E
          command: pnpm --filter @ririko/web exec playwright test
      - store_test_results:
          path: apps/web/e2e-results
      - store_artifacts:
          path: apps/web/e2e-results
          destination: e2e

  # Builds both production images and runs the smoke checks against them (docs/deployment.md
  # section 2.1). Images stay on the remote engine; nothing is pushed.
  docker:
    executor: node
    environment:
      BUILDX_VERSION: 0.37.2
    steps:
      - checkout
      - build-and-smoke

  # Tag-driven release (docs/release.md): runs only for git tags like v2.1.3 or v2.1.3-rc.1.
  # Builds and smoke-checks both images as the `docker` job does, then pushes
  # ririkoai/ririkobot and ririkoai/ririkobot-dashboard with the tags from
  # scripts/release-tags.ts (2.1.3, 2.1 and 2; a prerelease only gets its full version).
  # It never pushes `latest`; the maintainer moves that by hand.
  # Docker Hub credentials come from the CircleCI context `dockerhub` (DOCKERHUB_USERNAME and
  # DOCKERHUB_TOKEN, an access token with read and write scope), which the maintainer creates.
  # The deploy jobs below run after it.
  release:
    executor: node
    environment:
      BUILDX_VERSION: 0.37.2
    steps:
      - checkout
      - run:
          name: Docker Hub tags for this git tag
          command: |
            node scripts/release-tags.ts "$CIRCLE_TAG" > /tmp/release-tags
            cat /tmp/release-tags
            if grep -qx latest /tmp/release-tags; then echo 'Refusing to push latest' && exit 1; fi
      - build-and-smoke
      - run:
          name: Push both images to Docker Hub
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            while read -r tag; do
              docker tag ririko-bot:smoke "ririkoai/ririkobot:$tag"
              docker tag ririko-web:smoke "ririkoai/ririkobot-dashboard:$tag"
              docker push "ririkoai/ririkobot:$tag"
              docker push "ririkoai/ririkobot-dashboard:$tag"
            done < /tmp/release-tags
            docker logout

  # Deploys the version of the git tag to one production host (docs/release.md). Called once per
  # host and environment, each with its own CircleCI context that holds the host's variables, so
  # a host is a parameter and a new one is one more call, not a copy. The remote command is the
  # same for both kinds of host: an app host deploys the whole stack, and a Lavalink host (its
  # CI key is forced to one instance, deploy/host/bin/ririko-deploy-ssh) updates the Lavalink
  # instance of the same environment, and only when that instance's files changed.
  deploy:
    docker:
      - image: cimg/base:current
    resource_class: small
    parameters:
      environment:
        description: Which environment to deploy to
        type: enum
        enum: [staging, production]
      host:
        description: app (the bot stack; context deploy-<environment>) or lavalink (the Lavalink node; context deploy-lavalink-<environment>)
        type: enum
        enum: [app, lavalink]
        default: app
    steps:
      - run:
          name: Check the git tag
          command: |
            : "${CIRCLE_TAG:?This job runs only for release tags}"
            echo "Deploying ${CIRCLE_TAG#v} to << parameters.host >> << parameters.environment >>"
      - ssh-host:
          remote_command: 'deploy ${CIRCLE_TAG#v}'

  secrets:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C /tmp gitleaks
            /tmp/gitleaks version
      - run:
          name: Scan full git history
          # Same rules as the .husky/pre-commit hook; known findings live in .gitleaksignore.
          command: /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - test
      - test-postgres
      - build-web
      - e2e
      - docker
      - secrets
  # Keep the tag pattern in sync with RELEASE_TAG_PATTERN in scripts/release-tags.ts.
  release:
    jobs:
      - release:
          context: dockerhub
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      # After the images are pushed: every release tag deploys to staging, and only a final
      # vX.Y.Z waits for a maintainer's approval before production. Each environment updates its
      # Lavalink instance first (the release ships docker/lavalink/application.yml, so a new
      # plugin pin must be running before the bot that needs it), then the app host. Each job
      # keeps its own tag filter, because CircleCI skips a job on tags without one.
      - deploy:
          name: deploy-lavalink-staging
          host: lavalink
          environment: staging
          context: deploy-lavalink-staging
          requires:
            - release
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - deploy:
          name: deploy-staging
          environment: staging
          context: deploy-staging
          requires:
            - deploy-lavalink-staging
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-.+)?$/
            branches:
              ignore: /.*/
      - approve-production:
          type: approval
          requires:
            - deploy-staging
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - deploy:
          name: deploy-lavalink-production
          host: lavalink
          environment: production
          context: deploy-lavalink-production
          requires:
            - approve-production
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - deploy:
          name: deploy-production
          environment: production
          context: deploy-production
          requires:
            - deploy-lavalink-production
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
